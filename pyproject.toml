[project]
name = "faithfuldocvqa"
version = "0.1.0"
description = "OCR-grounded DocVQA with faithful citation or honest abstention — SFT + GRPO on Qwen3-VL"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "anthropic>=0.96.0",
    "augraphy==8.2.0",
    "datasets>=4.8.4",
    "jiwer>=4.0.0",
    "matplotlib>=3.10.9",
    "modal>=1.5.1",
    "numba>=0.65.0",
    "pandas>=3.0.2",
    "peft>=0.19.1",
    "pillow>=12.2.0",
    "pydantic>=2.13.3",
    "pytesseract>=0.3.13",
    "scikit-image>=0.26.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "transformers>=5.12.0",
    "wandb>=0.27.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "nbclient>=0.11.0",
    "nbformat>=5.11.0",
    "pytest>=9.1.0",
]
